name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Apps Script에 올릴 파일(index.html, Code.js, appsscript.json). docs/APPS_SCRIPT_SETUP.md 참고.
      - uses: actions/upload-artifact@v4
        with:
          name: apps-script
          path: dist
