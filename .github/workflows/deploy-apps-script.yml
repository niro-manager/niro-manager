name: Deploy Apps Script

# main에 들어간 커밋의 CI가 성공하면 Apps Script 프로젝트에 올리고 기존 웹 앱 배포를 새 버전으로 갱신한다(URL 유지).
# 1회 설정과 비밀값(Secrets)은 docs/APPS_SCRIPT_SETUP.md의 "자동 배포(1회 설정)" 참고. 비밀값이 없으면 배포를 건너뛴다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'niro-manager/niro-manager' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 버전을 고정한다. 명령 문법(push -f, update-deployment)은 3.4.1 기준.
      - run: npm install --global @google/clasp@3.4.1
      - name: Push to Apps Script and update the existing deployment
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          DIST_DIR: dist
        run: bash scripts/deploy-apps-script.sh
      - name: Remove credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/apps-script-deploy"
